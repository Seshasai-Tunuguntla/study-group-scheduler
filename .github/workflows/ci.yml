name: CI

on:
  push:
  pull_request:

jobs:
  server-tests:
    name: Server lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches the major version Neon runs in production.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: study_scheduler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # Not `npm ci`: the Mac-generated lockfile omits Linux-only optional packages (oxlint, jest).
      - run: npm install
      - run: npm run lint
      - name: Point tests at the CI database
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/study_scheduler_test"
          JWT_SECRET="ci-test-secret"
          CLIENT_ORIGIN="http://localhost:5180"
          EOF
      - run: npm test

  client-build:
    name: Client lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
