name: CI

on:
  push:
  pull_request:

jobs:
  server-tests:
    name: Server lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches the major version Neon runs in production.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: study_scheduler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # Not `npm ci`: the Mac-generated lockfile omits Linux-only optional packages (oxlint, jest).
      - run: npm install
      - run: npm run lint
      - name: Point tests at the CI database
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/study_scheduler_test"
          JWT_SECRET="ci-test-secret"
          CLIENT_ORIGIN="http://localhost:5180"
          EOF
      - run: npm test

  client-build:
    name: Client lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm test
      # WCAG AA contrast for every colour pair the components use, in both themes.
      - run: npm run contrast
      - run: npm run build

  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: study_scheduler_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/study_scheduler_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json
      - run: npm install
        working-directory: server
      - run: npm install
        working-directory: client
      - run: npm install
        working-directory: e2e
      # Starts the API (which migrates and seeds the demo) and the built client, then runs the test
      # in the runner's preinstalled Google Chrome.
      - run: npm test
        working-directory: e2e
      - name: Keep the report and trace if it failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
