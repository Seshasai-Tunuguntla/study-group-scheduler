<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The page colour of each theme (src/theme/theme.js retargets these while a theme is pinned). -->
    <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)" data-theme-color="light" />
    <meta name="theme-color" content="#1a2130" media="(prefers-color-scheme: dark)" data-theme-color="dark" />
    <script>
      // Applies a theme pinned with the theme button before the first paint, so the page never
      // flashes the other theme. Same key and values as src/theme/theme.js.
      try {
        const theme = localStorage.getItem('study-scheduler:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {
        // Storage blocked: follow the system setting.
      }
    </script>
    <meta name="description" content="Find the best weekly meeting time for your study group: everyone marks their free times, and a heatmap shows who can make it. Try the live demo." />
    <title>Study Scheduler: find your study group's best weekly time</title>
    <!-- Link previews (Open Graph, and Twitter/X cards), the same for every page of the app.
         Absolute URLs on our own domain; og-image.png is the group heatmap, 1200x630. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Study Scheduler" />
    <meta property="og:title" content="Study Scheduler: find your study group's best weekly time" />
    <meta property="og:description" content="Everyone marks when they're free; a heatmap and ranked suggestions show the best time to meet. Try the live demo, no sign-up." />
    <meta property="og:url" content="https://study-group-scheduler-green.vercel.app/" />
    <meta property="og:image" content="https://study-group-scheduler-green.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A study group's heatmap: how many members are free each half hour of the week, with the best times numbered" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Study Scheduler: find your study group's best weekly time" />
    <meta name="twitter:description" content="Everyone marks when they're free; a heatmap and ranked suggestions show the best time to meet. Try the live demo, no sign-up." />
    <meta name="twitter:image" content="https://study-group-scheduler-green.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="A study group's heatmap: how many members are free each half hour of the week, with the best times numbered" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;700&family=Red+Hat+Text:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
